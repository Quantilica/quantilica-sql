[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantilica-sql"
version = "0.1.1"
description = "Motor unificado de ingestão, particionamento e pipelines analíticos no PostgreSQL para o ecossistema Quantilica"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "quantilica",
    "postgresql",
    "etl",
    "analytics",
    "brazil",
    "open-data",
    "pipelines",
    "copy-streaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.12.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "orjson>=3.11.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
]

[project.entry-points."quantilica.commands"]
sql = "quantilica_sql.cli:app"

[project.scripts]
quantilica-sql = "quantilica_sql.cli:main"

[project.urls]
Homepage = "https://github.com/Quantilica/quantilica-sql"
Repository = "https://github.com/Quantilica/quantilica-sql"
Issues = "https://github.com/Quantilica/quantilica-sql/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/typer.Argument() como default
"src/quantilica_sql/cli.py" = ["B008"]
